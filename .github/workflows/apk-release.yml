name: SonicMusic APK release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version name (MAJOR.MINOR.PATCH)
        required: true
        type: string

concurrency:
  group: sonicmusic-apk-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      previous_tag: ${{ steps.baseline.outputs.tag }}
      previous_sha: ${{ steps.baseline.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Load the last published APK
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-input
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > release-input/previous.json
          tag=$(jq -er '.tag_name' release-input/previous.json)
          asset=$(jq -er '[.assets[] | select(.name | endswith(".apk"))] |
            if (map(select(.name == "app-release.apk")) | length) == 1 then
              map(select(.name == "app-release.apk"))[0].name
            elif length == 1 then .[0].name else error("Previous release has no unambiguous APK") end' release-input/previous.json)
          gh release download "$tag" --pattern "$asset" --output release-input/previous.apk
          sha=$(sha256sum release-input/previous.apk | cut -d ' ' -f1)
          published=$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .digest // ""' release-input/previous.json)
          if [ -n "$published" ] && [ "$published" != "sha256:$sha" ]; then
            echo "Previous release checksum does not match Github" >&2
            exit 1
          fi
          printf 'tag=%s\nsha=%s\n' "$tag" "$sha" >> "$GITHUB_OUTPUT"
      - name: Build and verify the signed APK
        env:
          RELEASE_VERSION_NAME: ${{ inputs.version }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          INNERTUBE_API_KEY: ${{ secrets.INNERTUBE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          export KEYSTORE_FILE="$RUNNER_TEMP/sonicmusic-release.jks"
          export PREVIOUS_RELEASE_APK="$PWD/release-input/previous.apk"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE" || { echo "The original release keystore secret is missing."; exit 1; }
          chmod +x gradlew
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'ndk;26.1.10909125'
          ./gradlew :app:assembleRelease --no-daemon
          mkdir -p verified-release
          cp app/build/outputs/apk/release/{app-release.apk,sonicmusic-update.json} verified-release/
          cp release-input/previous.apk verified-release/
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: verified-release/
          if-no-files-found: error

  upgrade:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            abi: x86
            target: default
          - api: 35
            abi: x86_64
            target: google_apis
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: verified-release
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-android-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install over the last published release and confirm app data survives
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.abi }}
          disable-animations: true
          script: |
            set -euo pipefail
            app=com.sonicmusic.app
            adb root
            adb wait-for-device
            adb install verified-release/previous.apk
            adb shell am start -W -n "$app/.app.MainActivity" | tee previous-launch.txt
            grep -q 'Status: ok' previous-launch.txt
            db="/data/user/0/$app/databases/sonic_music.db"
            for attempt in {1..30}; do
              adb shell "test -s '$db'" && break
              sleep 1
            done
            old_inode=$(adb shell "stat -c %i '$db'" | tr -d '\r')
            adb shell am force-stop "$app"
            adb shell "printf release-upgrade > '/data/user/0/$app/release-upgrade-marker'"
            adb shell "sqlite3 '$db' \"INSERT INTO playlists(name,createdAt,updatedAt,isLocal) VALUES('Release upgrade sentinel',1,1,1)\""
            adb logcat -b crash -c
            adb install -r verified-release/app-release.apk
            adb shell am start -W -n "$app/.app.MainActivity" | tee updated-launch.txt
            grep -q 'Status: ok' updated-launch.txt
            expected=$(jq -r '.versionCode' verified-release/sonicmusic-update.json)
            adb shell dumpsys package "$app" | grep "versionCode=$expected "
            test "$(adb shell "cat '/data/user/0/$app/release-upgrade-marker'" | tr -d '\r')" = release-upgrade
            test "$(adb shell "stat -c %i '$db'" | tr -d '\r')" = "$old_inode"
            test "$(adb shell "sqlite3 '$db' \"SELECT COUNT(*) FROM playlists WHERE name='Release upgrade sentinel'\"" | tr -d '\r')" = 1
            sleep 7
            adb shell pidof "$app"
            if adb logcat -d -b crash | grep "Process: $app,"; then
              exit 1
            fi

  publish:
    needs: [build, upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: verified-release
      - name: Publish the exact verified APK and metadata together
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version }}
          BASELINE_TAG: ${{ needs.build.outputs.previous_tag }}
          BASELINE_SHA: ${{ needs.build.outputs.previous_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest.json
          test "$(jq -er '.tag_name' latest.json)" = "$BASELINE_TAG"
          asset=$(jq -er '[.assets[] | select(.name | endswith(".apk"))] |
            if (map(select(.name == "app-release.apk")) | length) == 1 then
              map(select(.name == "app-release.apk"))[0].name
            elif length == 1 then .[0].name else error("Previous release has no unambiguous APK") end' latest.json)
          gh release download "$BASELINE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --output latest.apk
          printf '%s  latest.apk\n' "$BASELINE_SHA" | sha256sum --check
          cd verified-release
          sha=$(jq -er '.sha256' sonicmusic-update.json)
          printf '%s  app-release.apk\n' "$sha" | sha256sum --check
          tag="v$VERSION_NAME"
          if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish 2>/dev/null); then
            jq -e --arg commit "$GITHUB_SHA" '.isDraft and .targetCommitish == $commit' <<< "$draft" > /dev/null
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "SonicMusic $VERSION_NAME" --generate-notes
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber app-release.apk sonicmusic-update.json
          mkdir -p uploaded
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern app-release.apk --pattern sonicmusic-update.json --dir uploaded
          cmp app-release.apk uploaded/app-release.apk
          cmp sonicmusic-update.json uploaded/sonicmusic-update.json
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
