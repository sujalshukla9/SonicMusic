name: SonicMusic APK release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version name (MAJOR.MINOR.PATCH)
        required: true
        type: string
      release_title:
        description: GitHub release display name (e.g. "Sonic Music V2")
        required: false
        default: ""
        type: string

concurrency:
  group: sonicmusic-apk-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'ndk;26.1.10909125'
      - name: Build Release APK
        env:
          RELEASE_VERSION_NAME: ${{ inputs.version }}
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew

          # Use release signing if keystore secret is available, otherwise debug signing
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "Using release keystore for signing"
            umask 077
            export KEYSTORE_FILE="$RUNNER_TEMP/sonicmusic-release.jks"
            trap 'rm -f "$KEYSTORE_FILE"' EXIT
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            ./gradlew :app:assembleRelease --no-daemon
          else
            echo "No keystore secret found — building with debug signing"
            ./gradlew :app:assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="" \
              -Pandroid.injected.signing.store.password="" \
              -Pandroid.injected.signing.key.alias="" \
              -Pandroid.injected.signing.key.password="" || \
            ./gradlew :app:assembleDebug --no-daemon
          fi

          mkdir -p out
          # Find the built APK (release or debug)
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Built APK: $APK"

          DISPLAY_NAME="${{ inputs.release_title }}"
          if [ -n "$DISPLAY_NAME" ]; then
            SAFE_NAME=$(echo "$DISPLAY_NAME" | sed 's/ /-/g')
            cp "$APK" "out/${SAFE_NAME}.apk"
          else
            cp "$APK" "out/app-release.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sonic-music-apk
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sonic-music-apk
          path: out
      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v$VERSION_NAME"
          display_title="${RELEASE_TITLE:-Sonic Music $VERSION_NAME}"

          # Delete old release/tag with same name if it exists
          gh release delete "$tag" --repo "$GH_REPO" --yes 2>/dev/null || true

          # Create the release and upload the APK
          gh release create "$tag" \
            --repo "$GH_REPO" \
            --title "$display_title" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --latest \
            out/*

          echo "✅ Published: $display_title ($tag)"
          gh release view "$tag" --repo "$GH_REPO"
